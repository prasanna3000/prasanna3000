<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" font-family="'JetBrains Mono','Fira Code',Menlo,Consolas,monospace" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b2e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <!-- one clip per typed line: width grows from 0 like a typewriter -->
    <clipPath id="c1"><rect x="40" y="62" height="30" width="0"><animate attributeName="width" from="0" to="920" begin="0.3s" dur="0.9s" fill="freeze" calcMode="discrete" values="0;60;120;180;240;300;920" keyTimes="0;0.15;0.3;0.45;0.6;0.8;1"/></rect></clipPath>
    <clipPath id="c2"><rect x="40" y="92" height="30" width="0"><animate attributeName="width" to="920" begin="1.4s" dur="0.01s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="40" y="132" height="30" width="0"><animate attributeName="width" from="0" to="920" begin="2.0s" dur="0.8s" fill="freeze" calcMode="discrete" values="0;70;140;210;280;920" keyTimes="0;0.2;0.4;0.6;0.8;1"/></rect></clipPath>
    <clipPath id="c4"><rect x="40" y="162" height="30" width="0"><animate attributeName="width" to="920" begin="3.0s" dur="0.01s" fill="freeze"/></rect></clipPath>
    <clipPath id="c5"><rect x="40" y="202" height="30" width="0"><animate attributeName="width" from="0" to="920" begin="3.6s" dur="0.6s" fill="freeze" calcMode="discrete" values="0;60;120;920" keyTimes="0;0.33;0.66;1"/></rect></clipPath>
    <clipPath id="c6"><rect x="40" y="232" height="30" width="0"><animate attributeName="width" to="920" begin="4.4s" dur="0.01s" fill="freeze"/></rect></clipPath>
    <clipPath id="c7"><rect x="40" y="272" height="30" width="0"><animate attributeName="width" from="0" to="920" begin="5.0s" dur="1.0s" fill="freeze" calcMode="discrete" values="0;60;120;180;240;300;920" keyTimes="0;0.15;0.3;0.45;0.6;0.8;1"/></rect></clipPath>
  </defs>

  <!-- window -->
  <rect x="4" y="4" width="992" height="332" rx="14" fill="url(#bg)" stroke="#30363d" stroke-width="1.5"/>
  <rect x="4" y="4" width="992" height="3" rx="1.5" fill="url(#glow)"/>
  <circle cx="30" cy="30" r="6" fill="#ff5f56"/>
  <circle cx="50" cy="30" r="6" fill="#ffbd2e"/>
  <circle cx="70" cy="30" r="6" fill="#27c93f"/>
  <text x="500" y="35" text-anchor="middle" fill="#8b949e" font-size="13">prasanna@prod: ~ — zsh</text>

  <g font-size="18">
    <text x="40" y="84" clip-path="url(#c1)"><tspan fill="#22d3ee">❯</tspan><tspan fill="#e6edf3"> whoami</tspan></text>
    <text x="40" y="114" clip-path="url(#c2)" fill="#ffffff" font-size="22" font-weight="700">Prasanna Reddy <tspan fill="url(#glow)">// DevSecOps Full-Stack Engineer</tspan></text>

    <text x="40" y="154" clip-path="url(#c3)"><tspan fill="#22d3ee">❯</tspan><tspan fill="#e6edf3"> cat focus.txt</tspan></text>
    <text x="40" y="184" clip-path="url(#c4)" fill="#a5b4fc">appsec · supply-chain security · backend · cloud · fintech</text>

    <text x="40" y="224" clip-path="url(#c5)"><tspan fill="#22d3ee">❯</tspan><tspan fill="#e6edf3"> uptime</tspan></text>
    <text x="40" y="254" clip-path="url(#c6)" fill="#86efac">up since 2020 · 4 companies · 8 systems shipped · load avg: high</text>

    <text x="40" y="294" clip-path="url(#c7)"><tspan fill="#22d3ee">❯</tspan><tspan fill="#e6edf3"> ./explore --next </tspan><tspan fill="#f9a8d4">LLMs · RAG · vector search · agents</tspan></text>
  </g>

  <!-- blinking cursor after last line -->
  <rect x="636" y="276" width="11" height="20" fill="#e6edf3" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.01;0.5;0.51" dur="1s" begin="6s" repeatCount="indefinite"/>
  </rect>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
